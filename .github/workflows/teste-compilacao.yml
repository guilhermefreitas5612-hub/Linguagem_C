name: Teste de compilacao C
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar com avisos
        run: gcc -std=c11 -Wall -Wextra -Wpedantic main.c produto.c categoria.c util.c -o sistema_estoque
